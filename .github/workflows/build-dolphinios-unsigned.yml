name: Build DolphiniOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_deb:
        description: "También generar los .deb para jailbreak (Cydia/Sileo)"
        type: boolean
        default: false
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-15

    env:
      DOL_ORG_ID: com.github.tu-usuario.dolphinios
      XCODE_COMMON_BUILD_ARGS: >-
        -project Source/iOS/App/DolphiniOS.xcodeproj
        -derivedDataPath ${{ github.workspace }}/build-Xcode
        -sdk iphoneos
        -destination generic/platform=iOS
        DOL_BUILD_SOURCE="development"
        CODE_SIGNING_ALLOWED="NO"
        CODE_SIGNING_REQUIRED="NO"
        ASSETCATALOG_COMPILER_APPICON_NAME="AppIcon"

    steps:
      - name: Checkout (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: DEBUG - Xcodes disponibles
        run: ls /Applications | grep Xcode

      - name: Fijar versión de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: DEBUG - buscar AppIcon en el repo
        run: find "${{ github.workspace }}/Source/iOS/App" -iname "*AppIcon*"

      - name: Instalar herramientas de build
        run: |
          brew install cmake ninja bartycrouch python3
          /opt/homebrew/bin/python3 -m pip install --break-system-packages polib

      - name: Compilar (Non-Jailbroken + TrollStore)
        run: |
          rm -rf "${{ github.workspace }}/archives" || true
          mkdir -p "${{ github.workspace }}/archives"

          xcodebuild archive \
            -archivePath "${{ github.workspace }}/archives/NonJailbroken.xcarchive" \
            -configuration "Release (Non-Jailbroken)" \
            -scheme "DiOS (NJB)" \
            DOL_PBID_ORGANIZATION_IDENTIFIER="${{ env.DOL_ORG_ID }}" \
            ${{ env.XCODE_COMMON_BUILD_ARGS }}

          xcodebuild archive \
            -archivePath "${{ github.workspace }}/archives/TrollStore.xcarchive" \
            -configuration "Release (TrollStore)" \
            -scheme "DiOS (JB)" \
            DOL_PBID_ORGANIZATION_IDENTIFIER="${{ env.DOL_ORG_ID }}" \
            ${{ env.XCODE_COMMON_BUILD_ARGS }}

      - name: Compilar (Jailbroken, opcional para .deb)
        if: ${{ inputs.build_deb }}
        run: |
          xcodebuild archive \
            -archivePath "${{ github.workspace }}/archives/Jailbroken.xcarchive" \
            -configuration "Release (Jailbroken)" \
            -scheme "DiOS (JB)" \
            DOL_PBID_ORGANIZATION_IDENTIFIER="${{ env.DOL_ORG_ID }}" \
            ${{ env.XCODE_COMMON_BUILD_ARGS }}

      - name: Empaquetar IPA / TIPA (firma ad-hoc)
        run: |
          mkdir -p "${{ github.workspace }}/products"

          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" \
            "${{ github.workspace }}/archives/NonJailbroken.xcarchive/Products/Applications/DolphiniOS.app" \
            "-" \
            "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Public.entitlements" \
            "${{ github.workspace }}/products/DolphiniOS-NonJailbroken.ipa"

          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateIpa.sh" \
            "${{ github.workspace }}/archives/TrollStore.xcarchive/Products/Applications/DolphiniOS.app" \
            "-" \
            "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" \
            "${{ github.workspace }}/products/DolphiniOS-TrollStore.tipa"

      - name: Empaquetar .deb (opcional, jailbreak)
        if: ${{ inputs.build_deb }}
        run: |
          brew install dpkg
          "${{ github.workspace }}/Source/iOS/App/Project/Scripts/CreateDeb.sh" \
            "${{ github.workspace }}/archives/Jailbroken.xcarchive/Products/Applications/DolphiniOS.app" \
            "-" \
            "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Private.entitlements" \
            "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/control-normal-rootless.in" \
            "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postinst.sh" \
            "${{ github.workspace }}/Source/iOS/App/Project/Package/Deb/postrm.sh" \
            "var/jb/Applications" \
            "${{ github.workspace }}/products/DolphiniOS-Jailbroken-Rootless.deb"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-beta-${{ github.run_number }}
          path: ${{ github.workspace }}/products/*
          if-no-files-found: error
